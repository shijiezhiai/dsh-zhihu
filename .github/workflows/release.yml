# Tagging publishes the prebuilt package: the tarball is what the plugin-market entry installs from,
# so its asset name stays 'dsh-zhihu.tgz' and 'releases/latest/download/dsh-zhihu.tgz' keeps working.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Check the tag matches the package version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($version)" >&2
            exit 1
          fi

      - name: Pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          mv dist/*.tgz dist/dsh-zhihu.tgz

      - name: Publish the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/dsh-zhihu.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/dsh-zhihu.tgz --title "$GITHUB_REF_NAME" --notes "Prebuilt package for $GITHUB_REF_NAME."
          fi

      # The catalog installs a pinned URL, so a release is not done until that exact URL installs into
      # a profile and the profile composes.
      - name: Install the published tarball into a throwaway profile
        run: |
          npm install --global @deepseek-ai/dsh@0.2.2-rc.1
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/dsh-zhihu.tgz"
          dsh plugin --profile smoke add "$url"
          installed="$(node -p "require(process.env.DSH_HOME + '/profiles/smoke/node_modules/@mayangyang/dsh-zhihu/package.json').version")"
          test "v$installed" = "$GITHUB_REF_NAME"
          dsh --profile smoke --dump-config > "$RUNNER_TEMP/smoke.yml"
          grep -q 'dsh-zhihu' "$RUNNER_TEMP/smoke.yml"
